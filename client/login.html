<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Resident portal</title>
  <script>try{var t=localStorage.getItem('portal-theme');document.documentElement.dataset.theme=t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <span class="home-icon">⌂</span>
        <div>
          <strong>Test</strong>
          <small>Property portal</small>
        </div>
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">Dark mode</button>
      </div>
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Sign in to your portal</h1>
      <p class="muted">Use the credentials provided by your property team.</p>
      <div id="error" class="alert error" role="alert" aria-live="polite" hidden></div>
      <form id="login-form">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script src="/theme.js"></script>
  <script src="/login.js"></script>
</body>
</html>
